# =====================================================
#  Configuration de Pages CMS (https://app.pagescms.org)
#  Interface pour ajouter des photos sans toucher au code.
#  Les fichiers modifiés sont ceux du dossier contenu/.
# =====================================================
#
# Nouvelle équipe ou nouvelle catégorie : il faut aussi l'ajouter
# dans les listes déroulantes « Équipe » / « Catégorie » ci-dessous
# (la valeur doit correspondre exactement aux identifiants de contenu/).

# Photos envoyées : rangées dans images/, chemin enregistré sans "/" au début
# (indispensable pour que le site marche sur raphdvs.github.io/picsbydvs/)
media:
  input: images
  output: images

content:
  # ----- Photos des équipes (page Sport) -----
  - name: photos-sport
    label: Photos Sport
    type: file
    path: contenu/photos-sport.json
    fields:
      - name: photos
        label: Photos et vidéos
        type: object
        list: true
        fields:
          - name: equipe
            label: Équipe
            type: select
            required: true
            options:
              values:
                - { value: football/cergy-pontoise, label: "Football — Cergy-Pontoise" }
                - { value: football/saint-ouen-laumone, label: "Football — AS Saint-Ouen-l'Aumône" }
                - { value: football/rc-gonesse, label: "Football — RC Gonesse" }
                - { value: football/fc-pierrelaye, label: "Football — FC Pierrelaye" }
                - { value: futsal/paris-acasa, label: "Futsal — Paris Acasa" }
                - { value: futsal/cergy-pontoise, label: "Futsal — Cergy-Pontoise" }
                - { value: hockey/les-jokers, label: "Hockey — Les Jokers" }
          - name: categorie
            label: Catégorie
            type: select
            required: true
            options:
              values:
                - { value: match, label: "Match" }
                - { value: media-day, label: "Media Day" }
                - { value: presentation-equipement, label: "Présentation équipement" }
          - name: src
            label: Photo (ou aperçu de la vidéo)
            type: image
          - name: video
            label: Vidéo .mp4 (facultatif)
            type: file
          - name: titre
            label: Titre (facultatif)
            type: string
          - name: selection
            label: Mettre en avant sur l'accueil (8 au maximum)
            type: boolean

  # ----- Photos des shootings -----
  - name: photos-shootings
    label: Photos Shootings
    type: file
    path: contenu/photos-shootings.json
    fields:
      - name: photos
        label: Photos et vidéos
        type: object
        list: true
        fields:
          - name: categorie
            label: Catégorie
            type: select
            required: true
            options:
              values:
                - { value: anniversaire, label: "Anniversaire" }
                - { value: studio, label: "Studio" }
                - { value: restaurant, label: "Restaurant" }
          - name: src
            label: Photo (ou aperçu de la vidéo)
            type: image
          - name: video
            label: Vidéo .mp4 (facultatif)
            type: file
          - name: titre
            label: Titre (facultatif)
            type: string
          - name: selection
            label: Mettre en avant sur l'accueil (8 au maximum)
            type: boolean

  # ----- Équipes (noms et photos de couverture) -----
  - name: equipes
    label: Équipes
    type: file
    path: contenu/equipes.json
    fields:
      - name: sports
        label: Sports
        type: object
        list: true
        fields:
          - name: id
            label: Identifiant (minuscules, sans espace ni accent — ne pas changer)
            type: string
            required: true
          - name: nom
            label: Nom du sport
            type: string
            required: true
          - name: equipes
            label: Équipes
            type: object
            list: true
            fields:
              - name: id
                label: Identifiant (minuscules, sans espace ni accent — ne pas changer)
                type: string
                required: true
              - name: nom
                label: Nom affiché
                type: string
                required: true
              - name: couverture
                label: Photo de couverture (facultatif, sinon la 1re photo)
                type: image

  # ----- Clients -----
  - name: clients
    label: Clients
    type: file
    path: contenu/clients.json
    fields:
      - name: clients
        label: Ils m'ont fait confiance
        type: object
        list: true
        fields:
          - name: nom
            label: Nom
            type: string
            required: true
          - name: logo
            label: Logo (facultatif)
            type: image
          - name: lien
            label: Site ou Instagram (facultatif)
            type: string

  # ----- Tarifs -----
  - name: tarifs
    label: Tarifs
    type: file
    path: contenu/tarifs.json
    fields:
      - { name: match, label: "Sport — Match (nombre seul, ex. 150 ; vide = masqué)", type: string }
      - { name: media-day, label: "Sport — Media Day", type: string }
      - { name: presentation-equipement, label: "Sport — Présentation équipement", type: string }
      - { name: evenement, label: "Shootings — Événements", type: string }
      - { name: studio, label: "Shootings — Studio", type: string }
      - { name: restaurant, label: "Shootings — Restaurant", type: string }
